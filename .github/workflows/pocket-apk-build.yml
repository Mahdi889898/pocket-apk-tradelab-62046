# Generated by Pocket APK for TradeLab
name: Build Android APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Gradle wrapper or version
        id: gradle-info
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
            VER=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -n1 | sed 's/gradle-//' || true)
            if [ -z "$VER" ]; then VER="8.13"; fi
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle (Wrapper)
        if: steps.gradle-info.outputs.use_wrapper == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Gradle (Fallback)
        if: steps.gradle-info.outputs.use_wrapper != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle-info.outputs.version }}

      - name: Prepare Android keystores & env
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          VARIANT="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$VARIANT" = "release" ] && [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks -storepass android \
              -alias upload -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Pocket APK,O=Android,C=US"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        run: |
          VARIANT="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$VARIANT" = "release" ]; then
            TASK="assembleRelease"
          else
            TASK="assembleDebug"
          fi
          if [ "${{ steps.gradle-info.outputs.use_wrapper }}" = "true" ]; then
            chmod +x ./gradlew
            ./gradlew $TASK --no-daemon --stacktrace
          else
            gradle $TASK --no-daemon --stacktrace
          fi

      - name: Collect APK files
        run: |
          mkdir -p apk-outputs
          find . -path "*/build/outputs/apk/*.apk" -type f -exec cp {} apk-outputs/ \;
          ls -la apk-outputs/
          if [ -z "$(ls -A apk-outputs)" ]; then
            echo "No APK files were generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-apk-output-${{ github.run_number }}
          path: apk-outputs/*.apk
          if-no-files-found: error

      - name: Publish Direct APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK Build #${{ github.run_number }}
          prerelease: true
          files: apk-outputs/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
